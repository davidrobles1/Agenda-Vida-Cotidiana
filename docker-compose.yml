# Local development infrastructure only (18-dev-environment.md).
# NOT for staging/production — target is a self-hosted rented server, hosting
# provider TBD (DEC-008/ADR-014, 22-decision-log.md); see 19-cicd.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vidacotidiana
      POSTGRES_USER: vidacotidiana
      POSTGRES_PASSWORD: vidacotidiana
    ports:
      - "5432:5432"
    volumes:
      - vida-cotidiana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidacotidiana"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    # INFRA-002: "vida-cotidiana" (dev) and "vida-cotidiana-test" (test) are
    # imported automatically from infra/keycloak/*.json on first start —
    # matching the issuer-uri values in application.yml/application-test.yml.
    # No Android/iOS/Web OIDC clients are defined yet (AND-002/IOS-002/WEB-002,
    # out of scope — no approved client names/roles exist).

volumes:
  vida-cotidiana-postgres-data:
