# Local development infrastructure only (18-dev-environment.md).
# NOT for staging/production — target is a self-hosted rented server, hosting
# provider TBD (DEC-008/ADR-014, 22-decision-log.md); see 19-cicd.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vidacotidiana
      POSTGRES_USER: vidacotidiana
      POSTGRES_PASSWORD: vidacotidiana
    ports:
      # Host port 5432 was occupied by something outside this compose project
      # on the machine this was verified on (found for real, not assumed) —
      # 5434 avoids the collision; only matters for host-external access,
      # container-to-container traffic (e.g. glitchtip-* below) always uses
      # the internal "postgres:5432" regardless of this host mapping.
      - "5434:5432"
    volumes:
      - vida-cotidiana-postgres-data:/var/lib/postgresql/data
      # Runs once on first init only — creates the separate "glitchtip"
      # database in this same instance (see "glitchtip-*" services below).
      # If Docker Desktop on macOS refuses this bind mount with "operation
      # not permitted" (found for real: a TCC/Full Disk Access restriction on
      # ~/Documents, unrelated to this compose file), grant Docker Desktop
      # Full Disk Access once in System Settings -> Privacy & Security, or
      # run `docker exec <postgres-container> psql -U vidacotidiana -c
      # "CREATE DATABASE glitchtip"` manually after `postgres` is up.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidacotidiana"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Unset by default (regular local/LAN dev is unaffected). Export these
      # before `docker compose up` only for a public single-hostname demo via
      # infra/caddy/Caddyfile.demo (see 18-dev-environment.md demo section) —
      # KC_HTTP_RELATIVE_PATH must match the path Caddy mounts Keycloak under
      # (/auth) so Keycloak's issuer/redirect URLs come out correct, and
      # KC_PROXY_HEADERS=xforwarded tells Keycloak to trust Caddy's
      # X-Forwarded-* headers for hostname/scheme detection.
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
      # UX-005: custom per-client login themes (Documentacion/02-ux-ui/login-theme.md).
      # /opt/keycloak/themes is empty in the base image (only a README.md) —
      # verified for real against this same image before mounting here — so
      # this bind mount can't shadow any built-in theme; it only adds ours.
      - ./infra/keycloak/themes:/opt/keycloak/themes
    # INFRA-002: "vida-cotidiana" (dev) and "vida-cotidiana-test" (test) are
    # imported automatically from infra/keycloak/*.json on first start —
    # matching the issuer-uri values in application.yml/application-test.yml.
    # Android/iOS/Web OIDC clients (android-app/ios-app/web-spa) are defined
    # in those realm files (AND-002/IOS-002/WEB-002).

  # WEB-006/INFRA-007: GlitchTip, self-hosted, Sentry-protocol-compatible error
  # tracking for the Web client. Local development infrastructure only, same
  # as Keycloak above — migrates to the rented server once INFRA-004 exists.
  # Reuses the "postgres" service above (separate "glitchtip" database, see
  # infra/postgres/init-glitchtip-db.sql) instead of running a second Postgres
  # container. Redis is GlitchTip's own documented requirement for its Celery
  # task queue (email, event ingestion) — not an addition of our own.
  glitchtip-redis:
    image: redis:7-alpine

  glitchtip-migrate:
    image: glitchtip/glitchtip:v4.1.3
    command: ./manage.py migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vidacotidiana:vidacotidiana@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-insecure-secret-change-if-ever-deployed}

  glitchtip-web:
    image: glitchtip/glitchtip:v4.1.3
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://vidacotidiana:vidacotidiana@postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-insecure-secret-change-if-ever-deployed}
      PORT: 8000
      GLITCHTIP_DOMAIN: http://localhost:8000
      # No outbound email in local dev — logs to the container's stdout instead.
      EMAIL_URL: consolemail://
      ENABLE_OPEN_USER_REGISTRATION: "true"
    volumes:
      - vida-cotidiana-glitchtip-uploads:/code/uploads

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1.3
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://vidacotidiana:vidacotidiana@postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-insecure-secret-change-if-ever-deployed}
      EMAIL_URL: consolemail://
    volumes:
      - vida-cotidiana-glitchtip-uploads:/code/uploads

volumes:
  vida-cotidiana-postgres-data:
  vida-cotidiana-glitchtip-uploads:
