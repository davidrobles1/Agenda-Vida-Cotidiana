spring:
  application:
    name: vida-cotidiana-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vidacotidiana}
    username: ${DB_USERNAME:vidacotidiana}
    password: ${DB_PASSWORD:vidacotidiana}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never auto-generate DDL (validate only).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # BLOQUE B (post-MVP): Vision Board image upload
  # (VisionBoardImageController). A slightly-above-the-domain-limit ceiling
  # (VisionBoardImageService.MAX_SIZE_BYTES, now 23MB — see that field's own
  # doc comment on the 2026-08-21 +15MB increase) — the servlet-level cap
  # exists so an oversized request is rejected before the controller even
  # runs, the service's own check is what produces the clear, typed
  # VALIDATION_ERROR response for the more common "just a bit too big" case.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer, e.g. http://localhost:8081/realms/vida-cotidiana
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/vida-cotidiana}

server:
  port: 8080

# WEB-002: the SPA (DEC-007) calls this API from a different origin (Vite dev
# server / eventual web hosting), so the browser enforces CORS. Comma-separated,
# defaults to the local Vite dev origin from Phase 1/2 of AND-002..WEB-003.
vida-cotidiana:
  cors:
    allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# BE-025/ADR-007/DEC-010: firebase.credentials-path is intentionally NOT declared here.
# Spring Boot's relaxed binding already maps an env var FIREBASE_CREDENTIALS_PATH to the
# property firebase.credentials-path without any entry in this file; declaring it here with
# a default (even an empty string) would make the property permanently "present" and defeat
# notification.infrastructure.PushNotificationConfig's @ConditionalOnProperty check, which
# needs true absence to fall back to the no-op adapter. Unset in this environment and in every
# test profile -> the no-op PushNotificationSender is used. Set the env var to a real Firebase
# service-account JSON path to activate the FCM adapter instead.

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.vidacotidiana: INFO
