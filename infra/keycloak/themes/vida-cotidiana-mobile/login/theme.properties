# UX-005/Documentacion/02-ux-ui/login-theme.md — real Keycloak theme,
# built on the actual keycloak.v2 base (verified against the running
# quay.io/keycloak/keycloak:25.0 image, not hand-guessed), not a plugin.
#
# parent=keycloak.v2 means every .ftl/.js/.css file NOT present in this
# theme (template.ftl, register.ftl, error.ftl, login-otp.ftl, etc.) falls
# back to the real, working Keycloak default — only login.ftl is overridden
# here, and only to add a brand mark line, so the Authorization Code + PKCE
# flow itself is untouched.
parent=keycloak.v2

# Re-declares the parent's own stylesheet (css/styles.css, resolved via the
# theme fallback chain, not copied) plus our own — appending, not replacing.
styles=css/styles.css css/login.css

# ${properties.kcBodyClass!} is read directly by the inherited template.ftl
# body tag; this is the hook used to scope login.css to this theme only
# (kept separate from vida-cotidiana-web's vc-theme-web body class).
kcBodyClass=vc-theme vc-theme-mobile
