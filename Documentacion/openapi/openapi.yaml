openapi: 3.0.3
info:
  title: Vida Cotidiana API
  version: 1.0.0
  description: >
    Canonical API contract for Vida Cotidiana V1. All timestamps are
    ISO-8601 in UTC. All identifiers are UUIDv4. Authentication is delegated
    to Keycloak (OIDC/OAuth 2.1, Authorization Code + PKCE, DEC-004/ADR-008);
    this API is a pure OAuth2 resource server and defines no /auth/* login
    endpoint of its own. An operational healthcheck (e.g. Spring Boot
    Actuator /actuator/health) exists outside this versioned business
    contract and is intentionally not documented here (see
    07-backend-architecture.md).
servers:
  - url: /api/v1
security:
  - keycloakBearer: []
paths:
  /me:
    get:
      summary: Get current user
      security:
        - keycloakBearer: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Request account deletion (soft delete, 30-day grace period before purge, DEC-015/ADR-012)
      security:
        - keycloakBearer: []
      responses:
        '202':
          description: Deletion requested; account moves to PENDING_DELETION, purged after 30 days
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/modes:
    post:
      summary: Enable a mode (Personal or Laboral) for the current user (ADR-015/FR-016/UC-15)
      description: >
        Only-additive — enables the given mode, there is no way to disable
        one yet (open, non-blocking TBD in ADR-015). Idempotent: enabling an
        already-enabled mode is a no-op that still returns 200. POST rather
        than PATCH /me — this is an action ("activate this mode"), the same
        style already used by POST /reminders/{id}/complete.
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableModeRequest'
      responses:
        '200':
          description: Mode enabled; returns the updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/devices:
    get:
      summary: List devices registered for push notifications for the authenticated user
      security:
        - keycloakBearer: []
      responses:
        '200':
          description: List of registered devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevicePushToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register or update the push token for the current device (upsert by token, DEC-005)
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePushToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/devices/{deviceId}:
    delete:
      summary: Remove a registered device (e.g. on logout from that device, FR-012)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reminders:
    get:
      summary: List own and shared reminders (paginated)
      security:
        - keycloakBearer: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated reminder list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    additionalProperties: true # BE-035, see PageMeta
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a reminder (caller becomes owner)
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReminderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reminders/{id}:
    get:
      summary: Get a reminder (owner or active collaborator)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reminder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update reminder (owner only). Requires the current version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReminderRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking) — the reminder was modified concurrently; refetch and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete reminder (owner only). Cascades to INVITATION/REMINDER_SHARE and notifies active collaborators before deletion (DEC-002).
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reminders/{id}/complete:
    post:
      summary: Toggle the single global completion state (owner or active collaborator, DEC-001). Optionally accepts the expected version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteReminderRequest'
      responses:
        '200':
          description: Completion state toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reminders/{id}/shares:
    get:
      summary: List collaborators and pending invitations for a reminder (owner only, paginated)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of shares and invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    additionalProperties: true # BE-035, see PageMeta
                    properties:
                      shares:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReminderShare'
                      invitations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Invite a collaborator by email or username (owner only)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created (does not reveal whether the email belongs to an existing account, SEC-001)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A pending invitation for this recipient already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reminders/{id}/shares/{shareId}:
    delete:
      summary: Revoke a collaborator's access immediately (owner only). Acts only on REMINDER_SHARE, never on INVITATION (DEC-003).
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: shareId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Access revoked (REMINDER_SHARE.status = REVOKED), effective immediately
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/invitations:
    get:
      summary: List pending invitations received by the authenticated user (paginated)
      security:
        - keycloakBearer: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    additionalProperties: true # BE-035, see PageMeta
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invitations/{invitationId}/accept:
    post:
      summary: Accept a pending invitation (recipient only). Implemented as an atomic conditional transition to avoid race conditions with a concurrent reject/expiry.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation accepted, collaboration is now active (REMINDER_SHARE created with status ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderShare'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{invitationId}/reject:
    post:
      summary: Reject a pending invitation (recipient only). Implemented as an atomic conditional transition.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{invitationId}:
    delete:
      summary: Cancel a pending invitation (inviter/owner only, before it is resolved by the recipient). Sets INVITATION.status = CANCELLED, never REVOKED (DEC-003).
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /warranties:
    get:
      summary: List own warranties (paginated) — BE-037/WEB-009, V2 (see 22-decision-log.md ADR-015 refinamiento 2026-08-18).
      security:
        - keycloakBearer: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated warranty list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    additionalProperties: true # BE-035, see PageMeta
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Warranty'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a warranty (caller becomes owner)
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarrantyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /warranties/{id}:
    get:
      summary: Get a warranty (owner only — no sharing/collaborator concept for this entity)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Warranty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update warranty (owner only). Requires the current version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarrantyRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking) — the warranty was modified concurrently; refetch and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete warranty (owner only)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /warranties/{id}/complete:
    post:
      summary: Toggle the completion state (owner only). Optionally accepts the expected version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteWarrantyRequest'
      responses:
        '200':
          description: Completion state toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /maintenance-records:
    get:
      summary: List own maintenance records (paginated) — BE-037/WEB-009, V2 (see 22-decision-log.md ADR-015 refinamiento 2026-08-18).
      security:
        - keycloakBearer: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated maintenance record list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    additionalProperties: true # BE-035, see PageMeta
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MaintenanceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a maintenance record (caller becomes owner)
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceRecordRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /maintenance-records/{id}:
    get:
      summary: Get a maintenance record (owner only — no sharing/collaborator concept for this entity)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: MaintenanceRecord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update maintenance record (owner only). Requires the current version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceRecordRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking) — the maintenance record was modified concurrently; refetch and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete maintenance record (owner only)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /maintenance-records/{id}/complete:
    post:
      summary: Toggle the completion state (owner only). Optionally accepts the expected version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMaintenanceRecordRequest'
      responses:
        '200':
          description: Completion state toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people:
    get:
      summary: List own people (paginated) — ADR-016/FR-021, V3. Módulo Laboral.
      security:
        - keycloakBearer: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated person list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    additionalProperties: true
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a person (caller becomes owner)
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /people/{id}:
    get:
      summary: Get a person (owner only)
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update person (owner only). Requires the current version for optimistic locking.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
