          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking) — the element was modified concurrently; refetch and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vision-board-images:
    post:
      summary: >
        Upload a Vision Board image (BLOQUE A post-MVP: file picker,
        drag & drop, or paste). Owned by the caller directly, independent of
        any one board — not nested under /vision-boards/{id} — so the same
        upload can back an IMAGE element on more than one board (e.g.
        duplicating an element) without re-uploading. Stored server-side
        (Postgres BYTEA — no S3-compatible object storage is provisioned in
        this environment yet); the response never echoes the original bytes
        back, only an internal `id` an IMAGE element's `data.imageId`
        references. Never depends on the original external URL a pasted/
        dropped image might have come from.
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBoardImage'
        '400':
          description: Not an image (unsupported content type), or the image exceeds the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The uploaded file exceeds the servlet-level request size ceiling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vision-board-images/{id}:
    get:
      summary: >
        Fetch a previously uploaded image's raw bytes (owner only).
        Requires the same bearer JWT as every other endpoint here — the
        frontend resolves `<img>` sources via an authenticated fetch + a
        local object URL, not a plain, unauthenticated `<img src>`.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The image bytes, with the original Content-Type.
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
            image/gif: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    keycloakBearer:
      type: oauth2
      description: >
        OAuth2/OIDC access token issued by Keycloak (Authorization Code +
        PKCE from the client). The backend validates the bearer JWT on every
        request as a pure OAuth2 resource server; it never issues its own
        session or token (DEC-004/ADR-008). Token issuer/JWK Set URL are
        environment configuration, not part of this contract.
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.example/realms/vida-cotidiana/protocol/openid-connect/auth
          tokenUrl: https://keycloak.example/realms/vida-cotidiana/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect authentication
  parameters:
    PageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page index.
    SizeParam:
      in: query
      name: size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size (max 100).
  schemas:
    Error:
      type: object
      description: Uniform error envelope. Never includes stack traces, SQL, internal names or secrets.
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: REMINDER_NOT_FOUND
        message:
          type: string
          example: The requested reminder was not found.
        traceId:
          type: string
    PageMeta:
      type: object
      # BE-035: additionalProperties: true is required here because PageMeta is combined via allOf
      # with a sibling object (page items) at each paginated endpoint — without it, strict allOf
      # validators (incl. swagger-request-validator/TEST-API-001) reject each branch as a closed
      # schema and fail the sibling's fields as "not allowed", even though the merged instance is
      # exactly what the composed schema intends. Not a loosening of type/required validation.
      additionalProperties: true
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    User:
      type: object
      required: [id, email, personalEnabled, laboralEnabled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
        deletionStatus:
          type: string
          enum: [ACTIVE, PENDING_DELETION, DELETED]
        personalEnabled:
          type: boolean
          description: ADR-015/FR-014/FR-016. Only-additive — there is no matching "disable" yet (open, non-blocking TBD in ADR-015).
        laboralEnabled:
          type: boolean
          description: ADR-015/FR-014/FR-016. Only-additive — see personalEnabled.
    EnableModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [PERSONAL, LABORAL]
    CreateReminderRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        dueAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp in UTC.
        context:
          type: string
          enum: [PERSONAL, LABORAL]
          description: >
            ADR-015/FR-019. Optional — inferred by the client from the navbar
            of origin, no selector in the create form. Omitted by every
            pre-ADR-015 caller; the server defaults to PERSONAL when absent
            (same reasoning as the REMINDER.context backfill migration).
        iconId:
          type: string
          maxLength: 32
          description: >
            Funcionalidad Agenda completa (V2). Opcional — identificador
            estable de un catálogo que resuelve el frontend
            (web/src/core/ui/pickers/pickerCatalog.ts), nunca una ruta de
            asset. Mismo contrato que Note.iconId.
        stickerId:
          type: string
          maxLength: 32
        personId:
          type: string
          format: uuid
          description: >
            ADR-016/FR-023. Opcional — debe pertenecer al mismo dueño; si no,
            404 PERSON_NOT_FOUND (nunca revela existencia de un recurso ajeno).
        projectId:
          type: string
          format: uuid
          description: ADR-016/FR-023. Opcional — mismo contrato de autorización que personId (404 PROJECT_NOT_FOUND).
        location:
          type: string
          maxLength: 500
          description: ADR-016/FR-024. Opcional — solo relevante para una "reunión" (context=LABORAL con participantes vía reminders/{id}/shares).
    UpdateReminderRequest:
      type: object
      description: Partial update. version is required to detect concurrent modifications (optimistic locking).
      required: [version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        dueAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp in UTC.
        iconId:
          type: string
          maxLength: 32
          description: >
            NO es parcial como title/description/dueAt — siempre se aplica
            tal cual se envía (incluida su ausencia, que lo limpia). Mismo
            contrato que UpdateNoteRequest.iconId.
        stickerId:
          type: string
          maxLength: 32
        personId:
          type: string
          format: uuid
          description: ADR-016/FR-023. Parcial (null deja el valor sin cambios) — no existe forma de desvincular una vez asignado en V3.
        projectId:
          type: string
          format: uuid
          description: ADR-016/FR-023. Mismo contrato parcial que personId.
        location:
          type: string
          maxLength: 500
          description: ADR-016/FR-024. Mismo contrato parcial que title/description.
        version:
