          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        theme:
          type: string
          enum: [LIGHT, DARK, PAPER, NATURAL, CALM, ENERGY]
          description: >
            Board Theme (FASE 16) — independent of the app's own visual
            theme. Optional on create; defaults to LIGHT when omitted. The
            actual color palette per theme is defined once, centrally, on
            the frontend (visionBoardThemes.ts) — this is only ever the
            stable id, same contract as iconId/stickerId elsewhere in this API.
    UpdateVisionBoardRequest:
      type: object
      description: >
        Partial update para name/description/width/height/theme
        (opcionales, null deja el valor guardado sin cambios) — así también
        se persiste un cambio de Board Theme (FASE 16): el cliente envía
        solo { theme, version }, no existe un endpoint dedicado para esto.
        version es obligatorio (bloqueo optimista).
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        theme:
          type: string
          enum: [LIGHT, DARK, PAPER, NATURAL, CALM, ENERGY]
        version:
          type: integer
          description: Expected current version of the vision board; a mismatch returns 409.
    VisionBoard:
      type: object
      required: [id, name, width, height, theme, version]
      description: Owner-only entity — no sharing/collaborator concept, mismo criterio que Note/Warranty.
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        width:
          type: integer
        height:
          type: integer
        theme:
          type: string
          enum: [LIGHT, DARK, PAPER, NATURAL, CALM, ENERGY]
          description: Board Theme (FASE 16) — always present, defaults to LIGHT.
        version:
          type: integer
          description: Optimistic locking version, incremented on every update.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        elements:
          type: array
          description: Only populated by GET /vision-boards/{id} — omitted on the list endpoint (GET /vision-boards).
          items:
            $ref: '#/components/schemas/VisionBoardElement'
    CreateElementRequest:
      type: object
      required: [type, x, y, width, height]
      properties:
        type:
          type: string
          enum: [TEXT, IMAGE, NOTE, STICKER, SHAPE]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        data:
          type: object
          additionalProperties: true
          description: Type-specific payload (font/color for TEXT, url/crop for IMAGE, etc.) — shape varies per `type`, validated client-side. Optional; defaults to an empty object.
    UpdateElementRequest:
      type: object
      description: >
        Partial update para x/y/width/height/rotation/zIndex/locked/visible
        (opcionales, null deja el valor guardado sin cambios). data NO es
        parcial — siempre se aplica tal cual se envía cuando está presente
        (mismo contrato que iconId/stickerId en otras entidades). version es
        obligatorio (bloqueo optimista, independiente del version del board).
      required: [version]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        rotation:
          type: number
          format: double
        zIndex:
          type: integer
        locked:
          type: boolean
        visible:
          type: boolean
        data:
          type: object
          additionalProperties: true
        version:
          type: integer
          description: Expected current version of the element; a mismatch returns 409.
    ReorderElementRequest:
      type: object
      description: >
        direction is FRONT (al frente), BACK (al fondo), RAISE (subir una
        capa) o LOWER (bajar una capa) — RAISE/LOWER swap the element with
        whichever one is immediately above/below it in paint order. version
        es obligatorio (bloqueo optimista sobre el elemento objetivo).
      required: [direction, version]
      properties:
        direction:
          type: string
          enum: [FRONT, BACK, RAISE, LOWER]
        version:
          type: integer
          description: Expected current version of the target element; a mismatch returns 409.
    VisionBoardImage:
      type: object
      required: [id, contentType, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
        sizeBytes:
          type: integer
          format: int64
    VisionBoardElement:
      type: object
      required: [id, boardId, type, x, y, width, height, rotation, zIndex, locked, visible, version]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        type:
          type: string
          enum: [TEXT, IMAGE, NOTE, STICKER, SHAPE]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        rotation:
          type: number
          format: double
        zIndex:
          type: integer
        locked:
          type: boolean
        visible:
          type: boolean
        data:
          type: object
          additionalProperties: true
        version:
          type: integer
          description: Optimistic locking version, incremented on every update — independent of the board's own version.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Input validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authenticated (missing or invalid bearer token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is authenticated but has no permission on this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource does not exist or is not accessible to the caller (never distinguishes the two, to avoid leaking existence, SEC-001).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: Invitation already expired or already resolved (accepted/rejected/cancelled); grants no access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded (applies especially to invitation creation, to mitigate abuse/enumeration).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
