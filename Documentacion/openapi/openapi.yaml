    post:
      summary: >
        Move an element exactly one position relative to its immediately
        adjacent neighbor in paint order (RAISE/LOWER), or to the very
        front/back (FRONT/BACK). Owner only, via the board. Atomically
        renumbers every element on the board to a dense zIndex sequence
        matching the new order and returns all of them, so the caller can
        sync every affected element without a full board refetch. Requires
        the target element's current version for optimistic locking — the
        renumbering of its siblings is a side effect of this one action, not
        something the caller is expected to have a version for.
      security:
        - keycloakBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: elementId
          required: true
          schema:
            type: string
            format: uuid
